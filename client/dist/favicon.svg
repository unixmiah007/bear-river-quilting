<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bear River Quilting">
  <title>Bear River Quilting</title>
  <rect width="32" height="32" rx="7" fill="#0a0a0a" />
  <!-- Nine-patch -->
  <rect x="5" y="5" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.22" />
  <rect x="13" y="5" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.38" />
  <rect x="21" y="5" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.26" />
  <rect x="5" y="13" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.34" />
  <rect x="13" y="13" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.14" />
  <rect x="21" y="13" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.32" />
  <rect x="5" y="21" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.24" />
  <rect x="13" y="21" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.36" />
  <rect x="21" y="21" width="6" height="6" rx="0.9" fill="#fafafa" opacity="0.2" />
  <!-- Stitch arc -->
  <path
    d="M 6 24 Q 16 14 26 24"
    fill="none"
    stroke="#fafafa"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-dasharray="1.6 2.8"
    opacity="0.45"
  />
  <!-- Needle -->
  <line
    x1="24"
    y1="8"
    x2="20"
    y2="12"
    stroke="#fafafa"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.55"
  />
  <circle cx="24" cy="8" r="1.2" fill="#fafafa" opacity="0.65" />
</svg>
