# Copy to /etc/nginx/sites-available/bear-river (adjust server_name and upstream port).
# Symlink: sudo ln -sf /etc/nginx/sites-available/bear-river /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

upstream bear_river_node {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 25m;

    location / {
        proxy_pass http://bear_river_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After TLS (certbot), certbot usually adds a second server { listen 443 ssl; ... } block
# or switches this file to SSL. Keep the same proxy_pass and headers.
